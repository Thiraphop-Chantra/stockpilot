name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked environment
        run: uv sync --locked
        env:
          UV_PYTHON: "3.11"
      - name: Lint
        run: make lint
        env:
          UV_PYTHON: "3.11"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Test
        run: make test

  reproducibility:
    # Regenerates the default dataset from the seed and validates it against the configured
    # targets; documentation statistics are checked against this fresh run.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Generate and validate the default dataset
        run: make data
      - name: Check that documented numbers match this run
        run: make docs-check
