[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stockpilot"
version = "0.1.0"
description = "Open-source pipeline from a distributor's raw data to replenishment decisions, built and demonstrated on synthetic data only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiraphop Chantra" }]
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.60",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
stockpilot = "stockpilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# One version of every package for all supported Pythons, so a seed produces the same data everywhere.
fork-strategy = "fewest"

[tool.hatch.build.targets.wheel]
packages = ["src/stockpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use stockpilot.synth.rng.stream() so every draw is reproducible from the seed."
"datetime.datetime.now".msg = "Wall-clock time breaks reproducibility; pass dates explicitly."
"datetime.datetime.today".msg = "Wall-clock time breaks reproducibility; pass dates explicitly."
"datetime.date.today".msg = "Wall-clock time breaks reproducibility; pass dates explicitly."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error:::stockpilot"]
